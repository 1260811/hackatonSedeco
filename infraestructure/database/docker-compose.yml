services:
  postgres:
    image: postgres:17-alpine
    container_name: tandas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tandas_demo}
      POSTGRES_USER: ${POSTGRES_USER:-tandas_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
      TZ: America/Mexico_City
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tandas_app} -d ${POSTGRES_DB:-tandas_demo}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
