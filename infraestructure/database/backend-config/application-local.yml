# Plantilla para src/main/resources/application-local.yml
# Ajusta el nombre de la aplicación si ya existe configuración.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tandas_demo
    username: tandas_app
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
